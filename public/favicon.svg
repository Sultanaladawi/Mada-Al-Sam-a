<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient (Cosmic Obsidian) -->
    <linearGradient id="favBg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#080C1A"/>
      <stop offset="100%" stop-color="#02040A"/>
    </linearGradient>

    <!-- Border Rim Gradient -->
    <linearGradient id="favRim" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>

    <!-- Acoustic Wave & Helix Gradient -->
    <linearGradient id="favWave" x1="20" y1="20" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>

    <!-- Center Ambient Glow -->
    <radialGradient id="favAura" cx="45%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 212, 170, 0.35)"/>
      <stop offset="60%" stop-color="rgba(99, 102, 241, 0.15)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="3" y="3" width="94" height="94" rx="25" fill="url(#favBg)"/>
  <rect x="3" y="3" width="94" height="94" rx="25" fill="url(#favAura)"/>
  <rect x="3" y="3" width="94" height="94" rx="25" stroke="url(#favRim)" stroke-width="2.5"/>
  <rect x="6.5" y="6.5" width="87" height="87" rx="22" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Iconic Glyph -->
  <g filter="url(#favGlow)">
    <!-- 1. Anatomical Ear Helix & Lobule Arch -->
    <path d="M 33 22 C 20 22 14 33 14 48 C 14 63 22 75 35 77 C 40 78 43 74 43 70 C 43 66 39 63 35 63 C 28 63 23 57 23 48 C 23 39 27 31 34 31 C 37 31 39 33 40 36" 
          stroke="url(#favWave)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 2. Central Neural Formant Spectrum Bars -->
    <!-- Low Formant -->
    <rect x="44.5" y="42" width="4.5" height="16" rx="2.25" fill="#38BDF8"/>
    <!-- Speech Formant (Clarifier Peak) -->
    <rect x="52.5" y="27" width="5" height="46" rx="2.5" fill="#FFFFFF"/>
    <rect x="52.5" y="45" width="5" height="28" rx="2.5" fill="#00D4AA"/>
    <!-- High Formant -->
    <rect x="61" y="36" width="4.5" height="28" rx="2.25" fill="#2DD4BF"/>

    <!-- 3. Expanding Range Arcs (مدى السمع) -->
    <path d="M 70.5 35 C 75.5 42 75.5 58 70.5 65" 
          stroke="#00D4AA" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M 79 26 C 87.5 38 87.5 62 79 74" 
          stroke="#00D4AA" stroke-width="3.8" stroke-linecap="round" stroke-opacity="0.8"/>

    <!-- Luminous Spark Node -->
    <circle cx="55" cy="27" r="2.2" fill="#FFFFFF"/>
  </g>
</svg>